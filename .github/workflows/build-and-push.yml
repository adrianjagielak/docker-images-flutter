name: Build and push Docker images

# Reads the Flutter versions declared in versions.json and, for each
# version, builds the image, smoke-tests it, and pushes it only if the
# test passes -- under its exact Flutter version tag and every channel
# tag (latest, stable, beta, ...) that points at it.
#
# The image is built into the runner's Docker daemon rather than pushed
# straight to the registry, so scripts/smoke_test.sh gets to run a real
# Flutter app build against it before anything reaches GHCR. A version
# that fails to build or fails its test publishes nothing at all, and
# the channel tags keep pointing at the last image that passed.
#
# Runs whenever the inputs change, on a weekly cadence to pick up
# base-image security updates, and on demand.

on:
  push:
    branches: [master]
    paths:
      - "versions.json"
      - "sdk/**"
      - ".github/workflows/build-and-push.yml"
      - "scripts/smoke_test.sh"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Restrict the build to a single Flutter version (optional, must match an entry in versions.json)."
        required: false
        type: string
  # Weekly rebuild to pull fresh base layers and OS patches even when the
  # Flutter version itself has not moved.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      empty: ${{ steps.matrix.outputs.empty }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build matrix from versions.json
        id: matrix
        env:
          FILTER_VERSION: ${{ inputs.flutter_version }}
        run: |
          # Group entries that share a flutter_version so we build the
          # image once and move every channel tag that points at it in
          # the same release.
          #
          # Image tags must not contain '+'. Flutter uses '+' for build
          # metadata in some pre-releases; replace with '-' as the old
          # ci.sh did.
          matrix=$(jq -c '
            [
              .images
              | group_by(.flutter_version)
              | .[]
              | {
                  flutter_version: .[0].flutter_version,
                  version_tag: (.[0].flutter_version | gsub("[+]"; "-")),
                  tags: ([.[].tags[]] | unique)
                }
            ]
            | { include: . }
          ' versions.json)

          if [ -n "${FILTER_VERSION:-}" ]; then
            matrix=$(jq -c --arg v "$FILTER_VERSION" '
              { include: [ .include[] | select(.flutter_version == $v) ] }
            ' <<<"$matrix")
          fi

          include_count=$(jq '.include | length' <<<"$matrix")
          echo "Matrix ($include_count entries):"
          jq . <<<"$matrix"

          {
            echo "matrix=$matrix"
            if [ "$include_count" -eq 0 ]; then
              echo "empty=true"
            else
              echo "empty=false"
            fi
          } >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.empty == 'false'
    name: ${{ matrix.version_tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Each version stands alone: one that fails to build or fails its
      # smoke test must not stop the others from being published.
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free up disk space
        # Flutter images are large, and this job holds both the build
        # cache and the loaded image at once. The image builds its own
        # Android SDK, so the runner's preinstalled copy is dead weight
        # and gets reclaimed too.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: sdk
          file: sdk/Dockerfile
          target: flutter
          platforms: linux/amd64
          # Load into the daemon instead of pushing, so the smoke test
          # can run against the real image before it is published.
          load: true
          push: false
          provenance: false
          build-args: |
            flutter_version=${{ matrix.flutter_version }}
          tags: flutter-image:under-test
          # One shared cache scope rather than one per Flutter version.
          # The image builds the Android SDK itself instead of inheriting
          # it from a prebuilt base, and those layers are identical for
          # every Flutter version -- a per-version scope would rebuild
          # the whole Android half every time a channel moves. A shared
          # scope keeps that prefix warm; the Flutter-specific layers
          # miss for a new version either way.
          cache-from: type=gha,scope=flutter
          cache-to: type=gha,mode=max,scope=flutter

      - name: Smoke test
        run: bash scripts/smoke_test.sh flutter-image:under-test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        env:
          CHANNEL_TAGS: ${{ toJson(matrix.tags) }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION_TAG: ${{ matrix.version_tag }}
        run: |
          # Only reached when the smoke test passed. The version tag goes
          # first so that if a later push fails, the channel tags are
          # still pointing at an image that exists and works.
          for t in "$VERSION_TAG" $(jq -r '.[]' <<<"$CHANNEL_TAGS"); do
            echo "Pushing ${IMAGE}:${t}"
            docker tag flutter-image:under-test "${IMAGE}:${t}"
            docker push "${IMAGE}:${t}"
          done
