name: Build and push Docker images

# Reads the Flutter versions declared in versions.json and releases each
# one through .github/workflows/release-image.yml, which builds the
# multi-arch image, smoke-tests it on a native runner per architecture,
# and only then moves the channel tags (latest, stable, beta, ...) onto
# it.
#
# Each version is released by its own call of that workflow, so a
# version that fails to build or fails its smoke test does not hold back
# the others. Runs whenever the inputs change, on a weekly cadence to
# pick up base-image security updates, and on demand.

on:
  push:
    branches: [master]
    paths:
      - "versions.json"
      - "sdk/**"
      - ".github/workflows/build-and-push.yml"
      - ".github/workflows/release-image.yml"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Restrict the build to a single Flutter version (optional, must match an entry in versions.json)."
        required: false
        type: string
  # Weekly rebuild to pull fresh base layers and OS patches even when the
  # Flutter version itself has not moved.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      empty: ${{ steps.matrix.outputs.empty }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build matrix from versions.json
        id: matrix
        env:
          FILTER_VERSION: ${{ inputs.flutter_version }}
        run: |
          # Group entries that share a flutter_version so we build the
          # image once and move every channel tag that points at it in
          # the same release.
          #
          # Image tags must not contain '+'. Flutter uses '+' for build
          # metadata in some pre-releases; replace with '-' as the old
          # ci.sh did.
          matrix=$(jq -c '
            [
              .images
              | group_by(.flutter_version)
              | .[]
              | {
                  flutter_version: .[0].flutter_version,
                  version_tag: (.[0].flutter_version | gsub("[+]"; "-")),
                  tags: ([.[].tags[]] | unique)
                }
            ]
            | { include: . }
          ' versions.json)

          if [ -n "${FILTER_VERSION:-}" ]; then
            matrix=$(jq -c --arg v "$FILTER_VERSION" '
              { include: [ .include[] | select(.flutter_version == $v) ] }
            ' <<<"$matrix")
          fi

          include_count=$(jq '.include | length' <<<"$matrix")
          echo "Matrix ($include_count entries):"
          jq . <<<"$matrix"

          {
            echo "matrix=$matrix"
            if [ "$include_count" -eq 0 ]; then
              echo "empty=true"
            else
              echo "empty=false"
            fi
          } >>"$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.empty == 'false'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/release-image.yml
    with:
      flutter_version: ${{ matrix.flutter_version }}
      version_tag: ${{ matrix.version_tag }}
      channel_tags: ${{ toJson(matrix.tags) }}
    secrets: inherit
