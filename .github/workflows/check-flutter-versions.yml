name: Check Flutter versions

# Polls the upstream Flutter release index, updates versions.json when a
# new stable or beta build appears, commits the change directly to the
# default branch, and kicks off the build workflow. Designed to run
# unattended on a schedule.
#
# Upstream has not moved on the overwhelming majority of runs, so that
# path is kept cheap: two small JSON fetches, no checkout, no git.

on:
  schedule:
    # Every five minutes -- the shortest interval GitHub supports for
    # `schedule`; a faster cron is silently coerced up to it.
    #
    # "1/5" is every 5 minutes starting at minute 1 (:01, :06, :11, ...).
    # Scheduled runs are best effort and queue behind the global spike at
    # popular slots, the top of the hour worst of all, so unpopular
    # minutes get dispatched sooner.
    - cron: "1/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: check-flutter-versions
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Only here so a wedged run cannot sit on the concurrency group; it
    # has to clear the post-push dispatch wait below.
    timeout-minutes: 10
    steps:
      - name: Probe for a new Flutter release
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RELEASES_URL: https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json
        run: |
          set -euo pipefail

          # versions.json as it currently stands on the branch, read over
          # the API rather than via actions/checkout so that a run which
          # finds nothing does no git work at all.
          current=$(gh api \
            -H "Accept: application/vnd.github.raw" \
            "repos/${GITHUB_REPOSITORY}/contents/versions.json?ref=${BRANCH}")

          # Retry transient blips: at twelve runs an hour a bare -f turns
          # every upstream hiccup into a red X.
          releases=$(curl -fsSL --max-time 30 \
            --retry 3 --retry-delay 2 --retry-all-errors "$RELEASES_URL")

          have_stable=$(jq -r 'first(.images[] | select(.tags | index("stable")) | .flutter_version) // ""' <<<"$current")
          have_beta=$(jq -r 'first(.images[] | select(.tags | index("beta")) | .flutter_version) // ""' <<<"$current")
          want_stable=$(jq -r '.current_release.stable as $h | first(.releases[] | select(.hash == $h) | .version) // ""' <<<"$releases")
          want_beta=$(jq -r '.current_release.beta as $h | first(.releases[] | select(.hash == $h) | .version) // ""' <<<"$releases")

          echo "committed: stable=$have_stable beta=$have_beta"
          echo "upstream:  stable=$want_stable beta=$want_beta"

          if [ -z "$want_stable" ] || [ -z "$want_beta" ]; then
            # Never read a truncated or restructured index as "the channel
            # moved" -- that would commit a bad bump and rebuild under it.
            echo "::error::Release index did not resolve both channels."
            exit 1
          fi

          if [ "$want_stable" != "$have_stable" ] || [ "$want_beta" != "$have_beta" ]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          else
            echo "No Flutter version changes."
            echo "changed=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.probe.outputs.changed == 'true'
        uses: actions/checkout@v6

      - name: Update versions.json
        if: steps.probe.outputs.changed == 'true'
        run: bash scripts/update_flutter_versions.sh

      - name: Commit and push
        id: commit
        if: steps.probe.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git --no-pager diff -- versions.json || true

          # The probe reads the branch over the API and can race a bump
          # that lands between that read and this step, so the working
          # tree -- not the probe -- is what actually gates the commit.
          if git diff --quiet -- versions.json; then
            echo "versions.json is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build a human-readable summary from the new versions.json so the
          # commit message captures which channels moved.
          summary=$(jq -r '
            .images
            | map("\(.tags | join("/")): \(.flutter_version)")
            | join(", ")
          ' versions.json)

          git add versions.json
          git commit -m "chore: update Flutter versions ($summary)"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger build workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ steps.commit.outputs.sha }}
        # Pushes made with GITHUB_TOKEN do not trigger downstream workflows,
        # so we explicitly dispatch the build after committing.
        #
        # workflow_dispatch resolves --ref to the branch tip *at dispatch
        # time*, and a freshly pushed commit can take a few seconds to become
        # visible to that resolver. Dispatching immediately therefore races
        # the push: if the old tip is resolved, the build checks out the
        # previous commit and rebuilds the previous Flutter version. (This is
        # exactly how 3.44.3 was committed but never built -- the dispatch
        # resolved to the prior 3.44.2 commit and rebuilt it under the
        # latest/stable tags.) Wait until the API reports our pushed commit as
        # the branch tip before dispatching, and fail loudly rather than
        # dispatch a stale build if it never shows up.
        run: |
          for attempt in $(seq 1 30); do
            remote_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BRANCH}" --jq '.sha')
            echo "Attempt ${attempt}: branch tip=${remote_sha} expected=${EXPECTED_SHA}"
            if [ "$remote_sha" = "$EXPECTED_SHA" ]; then
              echo "Pushed commit is visible to the API; dispatching build."
              gh workflow run build-and-push.yml --ref "$BRANCH"
              exit 0
            fi
            sleep 5
          done

          echo "::error::Pushed commit ${EXPECTED_SHA} never became the tip of ${BRANCH}; refusing to dispatch a stale build."
          exit 1
